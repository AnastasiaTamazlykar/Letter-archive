[package]
name = "paper_archive_0"
version = "0.1.0"
edition = "2024"

[dependencies]
printpdf = "0.7"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"
objc2-core-image = "0.3"
objc2-core-foundation = "0.3"
ttf-parser = "0.25"
objc2-core-graphics = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
eframe = "0.37"
# Extra egui widgets; we use its `TableBuilder`, a table whose columns fit the window.
egui_extras = "0.37"
# A small blocking HTTP client, to talk to the local model server. `json`: send and read
# JSON bodies. No default features: the server is plain `http://localhost`, so no TLS needed.
ureq = { version = "3", default-features = false, features = ["json"] }
# JSON values in Rust: builds the request body and reads the answer.
serde_json = "1"
rfd = "0.18"
objc2-pdf-kit = "0.3"
sha2 = "0.10"
# `sqlite`: Diesel's SQLite support. `returning_clauses_for_sqlite_3_35`: lets an INSERT
# hand back the new row's id (`.returning(..)`), which SQLite can do since version 3.35.
diesel = { version = "2.3.14", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
# Diesel talks to SQLite through this crate. `bundled` compiles a recent SQLite into the
# app instead of using the one macOS ships, which is too old for the search index's
# `trigram remove_diacritics` tokenizer.
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
jiff = "1.0.0"
